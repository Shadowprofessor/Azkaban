[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azkaban-agent"
version = "0.1.0"
description = "Local-first privacy forensics agent: capture, classify, score and explain your own device's traffic."
requires-python = ">=3.11"
dependencies = [
  "mitmproxy>=11",
  "websockets>=13",
  "psutil>=5.9",
  "numpy>=1.26",
  "requests>=2.31",
  "reportlab>=4",
  "onnxruntime>=1.18",
  "maxminddb>=2.5",
]

[project.optional-dependencies]
train = ["xgboost>=2", "scikit-learn>=1.4", "onnxmltools>=1.12", "onnx>=1.16"]
dev = ["pytest>=8"]

[project.scripts]
azkaban = "azkaban_agent.cli:main"

[tool.setuptools.packages.find]
include = ["azkaban_agent*"]

[tool.setuptools.package-data]
azkaban_agent = ["data/*.json", "data/*.onnx", "data/*.mmdb"]
