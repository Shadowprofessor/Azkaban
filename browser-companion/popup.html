<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GhostPrint Companion</title>
  <link rel="stylesheet" href="popup.css">
  <script defer src="popup.js"></script>
</head>
<body>
  <h1>GhostPrint Companion</h1>
  <p>When recording is on, GhostPrint receives only the hostname of the foreground website.</p>
  <label>Dashboard port <input id="port" type="number" value="8765" min="1" max="65535"></label>
  <label>Pairing code <input id="code" type="password" autocomplete="off"></label>
  <button id="toggle" disabled>Start recording</button>
  <button id="inspect" disabled>Check privacy links and permissions</button>
  <button id="open">Open GhostPrint</button>
  <p id="message" role="status"></p>
</body>
</html>
