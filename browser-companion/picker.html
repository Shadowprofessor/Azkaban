<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a tab to audit</title>
  <link rel="stylesheet" href="popup.css">
  <script defer src="inspection.js"></script>
  <script defer src="picker.js"></script>
</head>
<body class="picker">
  <h1>Choose a tab to audit</h1>
  <p>GhostPrint inspects only the tab you select. The tab list stays in this browser window.</p>
  <button id="list-tabs" disabled>Show open tabs</button>
  <p id="picker-status" role="status"></p>
  <ul id="open-tabs" aria-label="Open browser tabs"></ul>
  <button id="cancel-picker">Cancel</button>
</body>
</html>
